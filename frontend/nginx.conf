# ── HTTP → redirect to HTTPS (except ACME challenge) ───────────────────────
server {
    listen 80;
    server_name tools.scalebrandslab.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name tools.scalebrandslab.com;

    ssl_certificate     /etc/letsencrypt/live/tools.scalebrandslab.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.scalebrandslab.com-0001/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without a resolver, nginx resolves `backend` once at
    # config load and caches that address for the lifetime of its worker
    # processes. A backend-only deploy recreates that container on a new Docker
    # IP without touching this one, so nginx goes on proxying to an address
    # nothing listens on and every API call 502s until a human notices — which
    # is exactly what happened for ~37 minutes on 2026-08-19. `valid=10s` makes
    # nginx re-resolve continuously, so a moved backend self-heals in seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Runtime re-resolution only happens when the upstream is NOT a literal, so
    # the host has to come from a variable.
    #
    # Every proxy_pass below is deliberately written without a URI part. With a
    # variable, a URI part is passed *as is, replacing the request URI* instead
    # of substituting the matched location prefix — `/api/v1/auth/login` would
    # reach the backend as `/api/`. Each location's replacement here was already
    # an identity mapping (`/api/` → `/api/`, `/docs` → `/docs`, …), so passing
    # the original URI through unchanged preserves the previous behaviour byte
    # for byte. Do not add a URI part back without re-checking that.
    set $backend_upstream "backend:8000";

    # Serve React SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the FastAPI backend container
    # Default nginx limit is 1m — thumbnail create sends multipart ref + base images
    # (backend allows 10MiB per file; allow headroom for several files + overhead).
    location /api/ {
        client_max_body_size 100m;
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /openapi.json {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /docs {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /redoc {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
