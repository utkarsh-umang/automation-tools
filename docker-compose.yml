# Local dev infrastructure — Postgres, MongoDB, Redis, Celery worker, Flower
# Run: task dev:infra  (also started by task backend:up)
# Uses .env for credentials (must match backend config)

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Host 54332 avoids clashing with a local Postgres on the default 5432
      - "54332:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27021:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host 6383 → container 6379 (other services use redis:6379 on the Docker network)
      - "6383:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend-app
      dockerfile: Dockerfile.celery
    restart: unless-stopped
    environment:
      # Override host .env: inside the container localhost is not Postgres (use service name + internal port).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGO_LOCAL_URI: mongodb://mongo:27017
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend-app
      dockerfile: Dockerfile.celery
    command: celery -A app.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGO_LOCAL_URI: mongodb://mongo:27017
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    # Must match Redis auth used by celery-worker; if REDIS_PASSWORD is set, use e.g.
    # redis://:${REDIS_PASSWORD}@redis:6379/0 (and ensure special chars are URL-safe).
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  redis_data:
