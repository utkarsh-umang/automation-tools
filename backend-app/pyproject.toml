[tool.poetry]
name = "backend-app"
version = "0.1.0"
description = "FastAPI backend with Postgres, MongoDB, Redis"
authors = []
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
python-multipart = "^0.0.20"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic-settings = "^2.6.0"
sqlmodel = "^0.0.22"
asyncpg = "^0.30.0"
greenlet = "^3.0.0"
alembic = "^1.14.0"
pymongo = "^4.10.0"
motor = "^3.6.0"
redis = "^5.2.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = {extras = ["email"], version = "^2.12.5"}
bcrypt = "<4"
celery = "^5.6.2"
httpx = "^0.28.1"
requests = "^2.32.5"
google-api-python-client = "^2.0"
google-auth = "^2.0"
pandas = "^2.0"
ai-agents-service = { git = "https://github.com/utkarsh-umang/ai-agents-service.git" }
boto3 = "^1.42.0"
sentry-sdk = {version = "^2.19.0", optional = true}
sqlalchemy = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"

[tool.poetry.extras]
gcp = ["google-cloud-secret-manager"]
observability = ["sentry-sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802", "N815"]

[tool.ruff.lint.per-file-ignores]
# ``main.py`` loads ``app.bootstrap_env`` before other imports so ``.env`` is in ``os.environ``
# before any ``ai_agents`` (or similar) import-time checks.
"main.py" = ["E402", "I001"]
"scripts/verify_thumbnail_job_details_mongo.py" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
