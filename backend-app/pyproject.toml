[tool.poetry]
name = "backend-app"
version = "0.1.0"
description = "FastAPI backend with Postgres, MongoDB, Redis"
authors = []
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
python-multipart = "^0.0.20"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic-settings = "^2.6.0"
sqlmodel = "^0.0.22"
asyncpg = "^0.30.0"
greenlet = "^3.0.0"
alembic = "^1.14.0"
pymongo = "^4.10.0"
motor = "^3.6.0"
redis = "^5.2.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = {extras = ["email"], version = "^2.12.5"}
bcrypt = "<4"
celery = "^5.6.2"
httpx = "^0.28.1"
requests = "^2.32.5"
google-api-python-client = "^2.0"
google-auth = "^2.0"
pandas = "^2.0"
# Tracks `develop` and asks for the `thumbnail` extra only, so this backend never
# installs the email-finder stack (crawl4ai/playwright, litellm, langgraph).
# Was pinned to the `thumbnail-stable` branch, which isolated dependencies via git
# history because the package had one flat dependency list; extras replaced that.
# `thumbnail` is deliberately an empty extra — ai_agents/__init__.py eagerly imports
# the thumbnail agent, so its deps are core. Naming it keeps the intent explicit.
ai-agents-service = { git = "https://github.com/utkarsh-umang/ai-agents-service.git", branch = "develop", extras = ["thumbnail"] }
# Short Video tool: downloads the source video.
# NOT YET RUNNABLE IN THE IMAGE. Before the first job can run, Dockerfile.celery
# needs the ffmpeg binary (to cut clips and to mux yt-dlp's separate streams) and
# a JS runtime — yt-dlp deprecates extraction without one and silently loses
# formats. Deliberately not added yet: nothing invokes this code, and shipping
# both would grow the production image for no working feature. Until then
# resolve_ffmpeg() raises a clear FFmpegNotFound rather than failing obscurely.
yt-dlp = "^2026.7.4"
boto3 = "^1.42.0"
# Decodes user-uploaded references/base images so we can transcode whatever the
# browser's `image/*` picker let through (AVIF, HEIC-ish, animated GIF) into the
# JPEG/PNG/WebP the image providers accept. >=11.3 is the floor because that is
# where AVIF decoding became native — the manylinux wheels bundle libavif, so no
# system packages are needed in the image.
pillow = ">=11.3"
sentry-sdk = {version = "^2.19.0", optional = true}
sqlalchemy = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"

[tool.poetry.extras]
gcp = ["google-cloud-secret-manager"]
observability = ["sentry-sdk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802", "N815"]

[tool.ruff.lint.per-file-ignores]
# ``main.py`` loads ``app.bootstrap_env`` before other imports so ``.env`` is in ``os.environ``
# before any ``ai_agents`` (or similar) import-time checks.
"main.py" = ["E402", "I001"]
"scripts/verify_thumbnail_job_details_mongo.py" = ["E402"]
# Same reason: repo root goes on sys.path before the ``app`` package is importable.
"scripts/repair_octet_stream_references.py" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
